<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Decision Map" />
  <title>Decision Map</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="decision-card">
      <header class="map-header">
        <div>
          <h1>Decision Map</h1>
          <p id="graphStats">18 decisions · 21 links · 1 root · 0 standalone</p>
        </div>
        <button class="icon-button" id="fitHeader" title="Fit graph" aria-label="Fit graph">⛶</button>
      </header>

      <nav class="navigator" aria-label="Find decisions on the map">
        <div class="nav-find">
          <div class="date-jump">
            <input type="date" id="dateInput" aria-label="Jump to date" />
            <button id="dateGo">Go</button>
          </div>
          <div class="search-wrap">
            <input type="search" id="titleSearch" placeholder="Search by title…" aria-label="Search decisions by title" autocomplete="off" />
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <select id="topicSelect" aria-label="Jump to topic"><option value="">Topics</option></select>
        </div>
        <div class="nav-view">
          <div class="mode-switch" aria-label="Decision map view">
            <button data-mode="topics" class="active">Topics</button>
            <button data-mode="graph">Graph</button>
            <button data-mode="day">Day</button>
            <button data-mode="week">Week</button>
            <button data-mode="month">Month</button>
          </div>
          <button class="today-button" id="today">Today</button>
          <div class="nav-zoom" id="navZoom"><button id="navZoomOut" aria-label="Zoom out">−</button><span id="navZoomValue">100%</span><button id="navZoomIn" aria-label="Zoom in">+</button></div>
        </div>
      </nav>

      <div class="flow" id="flow">
        <div class="stage" id="stage"></div>

        <div class="tools-wrap">
          <button class="tool-trigger" id="toolTrigger" aria-label="Graph tools" title="Graph tools" aria-expanded="false">
            <span class="workflow-icon">⌘</span>
          </button>
          <div class="tools-menu" id="toolsMenu" hidden>
            <button id="newDecision"><span class="violet">○</span> New decision</button>
            <button id="addFollowup"><span class="teal">＋</span> Add follow-up</button>
            <hr />
            <button id="editDecision"><span>✎</span> Edit</button>
            <button id="deleteDecision"><span>⌫</span> Delete</button>
            <hr />
            <button id="tidy"><span>▦</span> Tidy layout</button>
            <button id="pin"><span>⌖</span> Pin view</button>
          </div>
        </div>

        <div class="zoom-top">
          <button id="zoomOut" aria-label="Graph zoom out">−</button>
          <span id="zoomValue">70%</span>
          <button id="zoomIn" aria-label="Graph zoom in">+</button>
        </div>

        <div class="flow-controls">
          <button id="controlIn" aria-label="Zoom in">＋</button>
          <button id="controlOut" aria-label="Zoom out">−</button>
          <button id="fit" aria-label="Fit view">⌗</button>
          <button id="lock" aria-label="Lock view">⌑</button>
        </div>

        <div class="overview-wrap">
          <button id="mapToggle" class="map-toggle" aria-expanded="true">▧ <span>Hide</span></button>
          <div class="minimap" id="minimap"><i></i></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=4"></script>
</body>
</html>
