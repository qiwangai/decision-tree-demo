<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Decision Map" />
  <title>Decision Map</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="decision-card">
      <header class="map-header">
        <div>
          <h1>Decision Map</h1>
          <p>6 decisions · 6 links · 1 root · 0 standalone</p>
        </div>
        <button class="icon-button" id="fitHeader" title="Fit graph" aria-label="Fit graph">⛶</button>
      </header>

      <div class="flow" id="flow">
        <div class="stage" id="stage"></div>

        <div class="tools-wrap">
          <button class="tool-trigger" id="toolTrigger" aria-label="Graph tools" title="Graph tools" aria-expanded="false">
            <span class="workflow-icon">⌘</span>
          </button>
          <div class="tools-menu" id="toolsMenu" hidden>
            <button><span class="violet">○</span> New decision</button>
            <button><span class="teal">＋</span> Add follow-up</button>
            <hr />
            <button><span>✎</span> Edit</button>
            <button><span>⌫</span> Delete</button>
            <hr />
            <button id="tidy"><span>▦</span> Tidy layout</button>
            <button id="pin"><span>⌖</span> Pin view</button>
          </div>
        </div>

        <div class="zoom-top">
          <button id="zoomOut" aria-label="Graph zoom out">−</button>
          <span id="zoomValue">70%</span>
          <button id="zoomIn" aria-label="Graph zoom in">+</button>
        </div>

        <div class="flow-controls">
          <button id="controlIn" aria-label="Zoom in">＋</button>
          <button id="controlOut" aria-label="Zoom out">−</button>
          <button id="fit" aria-label="Fit view">⌗</button>
          <button id="lock" aria-label="Lock view">⌑</button>
        </div>

        <div class="overview-wrap">
          <button id="mapToggle" class="map-toggle" aria-expanded="true">▧ <span>Hide</span></button>
          <div class="minimap" id="minimap"><i></i></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
